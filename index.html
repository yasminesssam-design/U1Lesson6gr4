*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,sans-serif;font-size:24px;line-height:1.7;color:#12305c;min-height:100vh;background:linear-gradient(120deg,#cfe8ff,#fff3cf,#d8f7e6,#cfe8ff);background-size:400% 400%;animation:bg 14s ease infinite;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 50%}}
.fl{position:fixed;left:0;font-size:40px;opacity:.35;animation:fy 14s linear infinite;z-index:0}
@keyframes fy{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
main{position:relative;z-index:1;max-width:1150px;margin:auto;padding:16px}
.logo{display:block;margin:0 auto;width:150px}
h1{text-align:center;font-size:34px;margin:4px}h2{font-size:30px}
.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 6px 18px #0002}
button,.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:14px 22px;margin:6px;cursor:pointer;background:#0b4a8b;color:#fff;font-size:24px;transition:.2s;display:inline-block;text-decoration:none}
button:hover{transform:scale(1.04)}.full{display:block;width:100%;text-align:center}
.o{display:block;width:100%;background:#fff;color:#12305c;border:3px solid #0b4a8b;text-align:start}
.ok{background:#28b463!important;color:#fff!important;animation:pop .5s}
.no{background:#e74c3c!important;color:#fff!important;animation:shk .5s}
.or{background:#f39c12}.gr{background:#1e9e5a}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shk{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.emo{position:fixed;left:50%;top:45%;font-size:110px;transform:translate(-50%,-50%);animation:up 1s forwards;z-index:9;pointer-events:none}
@keyframes up{to{top:12%;opacity:0}}
input{font:inherit;font-size:26px;padding:12px;border-radius:14px;border:3px solid #0b4a8b;width:90%}
.pb{height:16px;background:#ddd;border-radius:9px}.pb i{display:block;height:100%;background:#f39c12;border-radius:9px;transition:.4s}
.ch{display:flex;align-items:flex-end;gap:14px;height:150px;justify-content:center;direction:ltr}.ch b{width:70px;border-radius:8px 8px 0 0;color:#fff;text-align:center}
.top{background:linear-gradient(135deg,#0b4a8b,#2a7de1 60%,#f39c12);color:#fff;border-radius:28px;padding:14px;margin-bottom:10px;box-shadow:0 8px 22px #0b4a8b55;text-align:center}.top h1{margin:0;color:#fff;text-shadow:0 2px 6px #0006}
.top .logo{background:#fff;border-radius:50%;width:120px;padding:6px;box-shadow:0 4px 12px #0004}
.card{border:3px solid #ffffff;background:rgba(255,255,255,.95)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.col{border-radius:20px;padding:16px;font-size:23px;line-height:1.9}.a{background:#eaf3ff;border-top:10px solid #2a5fd0}.e{background:#fff4dc;border-top:10px solid #f39c12}
.ph{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#0b4a8b;color:#fff;border-radius:18px;padding:8px 18px;margin-bottom:12px;font-weight:800;font-size:26px;flex-wrap:wrap}
.btns{display:flex;flex-wrap:wrap;justify-content:space-around;margin-top:8px}
.o:hover{background:#eaf3ff}.card h2{margin:6px 0}
